[package]
name = "keyroost-piv-applet"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust PIV (NIST SP 800-73-4 / FIPS 201) card-side applet: host APDUs in, card responses out."

[dependencies]
# The host-side PIV byte layer: the instruction set, slots, algorithm
# identifiers, status words, and BER-TLV / SPKI / X.509 parsers this applet
# reuses for the responses it builds.
keyroost-piv = { version = "0.13.0" }
# APDU and codec primitives (TLV read/write) the command handlers parse with.
keyroost-proto = { version = "0.13.0" }
# The P-256 key material the key-slot commands generate, import and sign
# with: the same crates (and feature paths) the root host crate uses. The
# `ecdh` feature adds the shared-secret computation the slot key-agreement
# half of GENERAL AUTHENTICATE answers.
p256 = { version = "0.13.0", features = ["ecdh"] }
# The P-384 and P-521 slots (T9): the same curve-crate family as p256.
p384 = { version = "0.13.0", features = ["ecdh"] }
p521 = { version = "0.13.0", features = ["ecdh"] }
# The generic secret-key / prime-curve API the three NIST curves share
# (the same elliptic-curve major the 0.13 curve crates are built on).
elliptic-curve = "0.13"
ecdsa = { version = "0.16.0" }
# RSA slots (T10, staged by spike keyroost-agent-rpx): the RustCrypto RSA
# line. Both crates are already in the workspace lockfile (ssh-key pulls
# rsa 0.9.10), so this resolves offline with no new versions.
rsa = "0.9"
# The BigUint crate rsa 0.9 depends on (as `num_bigint`), as a direct dep
# because `mod_inverse` (qinv for the raw CRT op) is a trait method on
# `num_bigint_dig::traits::ModInverse` and rsa re-exports only the `BigUint`
# type, not the trait. Default features off: rsa enables the features this
# crate needs, and `std` would drag in `rand/std` + `serde` for no benefit
# (the BigUint core and ModInverse are no-std).
num-bigint-dig = { version = "0.8", default-features = false }
# Secret card state (PIN/PUK, management key, private key material) lives in
# Zeroizing containers.
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# The RustCrypto block-cipher line for the 9B management-key symmetric auth
# (GENERAL AUTHENTICATE witness/challenge round) — the same crates the
# host's keyroost-transport uses for its half of the exchange.
aes = "0.8"
cipher = "0.4"
des = "0.8"
# The CSPRNG feeding p256's key generation (`rand_core::OsRng`); the same
# pairing the GA witness/challenge values use.
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"
# CLI and logging for the `piv-vsmartcard` front end.
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
