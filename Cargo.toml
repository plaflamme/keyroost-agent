[package]
name = "keyroost-agent"
version = "0.1.0"
edition = "2024"
description = "Implementation of the ssh agent protocol on top of keyroost APIs"

[dependencies]
ecdsa = "0.16"
keyroost-openpgp = { version = "0.13.0" }
keyroost-piv = { version = "0.13.0" }
keyroost-transport = { version = "0.13.0" }
p256 = "0.13"
p384 = "0.13"
p521 = "0.13"
pinentry = "0.8"
sha2 = "0.10"
signature = "2"
ssh-agent-lib = "0.6"
tokio = { version = "1", default-features = false, features = ["net"] }
tracing = "0.1"
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[lints.clippy]
pedantic = "warn"
