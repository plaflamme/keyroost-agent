[package]
name = "keyroost-agent"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust SSH and GPG (gpg-agent) agent backed by smart-card PIV and OpenPGP applets via keyroost APIs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap-verbosity-flag = { version = "3", features = ["tracing"] }
ecdsa = "0.17"
keyroost-openpgp = { version = "0.16.0" }
keyroost-piv = { version = "0.16.0" }
keyroost-transport = { version = "0.16.0" }
p256 = "0.14"
p384 = "0.14"
p521 = "0.14"
sha1 = "0.11"
sha2 = "0.11"
signature = "3"
ssh-agent-lib = "0.6"
tokio = { version = "1", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = "0.3"
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[target.'cfg(target_os = "linux")'.dependencies]
prctl = "1"

[lints.clippy]
pedantic = "warn"
